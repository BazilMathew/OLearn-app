name: Android debug APK

# Builds an installable debug APK of OLearn (Capacitor) and attaches it to the run as "olearn-debug-apk".
# No signing secrets: the debug key is kept in the Actions cache so each new APK installs over the last one.

on:
  workflow_dispatch:
  push:
    branches: [ui-sandbox, main]

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Same debug key on every run, so Android accepts the new APK as an update (progress is kept).
      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: olearn-android-debug-keystore-v1

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: olearn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
